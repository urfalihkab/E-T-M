name: APK derle

on:
  push:
    branches: [main]
    paths-ignore: ['catalog/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: İmza anahtarını hazırla (tanımlıysa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee build.log; then
            # Hataları herkese açık açıklama (annotation) olarak yaz; kayıtlar oturum açmadan da okunabilsin.
            grep -E "^e: |error:|What went wrong|> .*(failed|Could not|not found)|Unresolved|ERROR" build.log | head -40 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/EgitimSeblaziz-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EgitimSeblaziz-apk
          path: out/*.apk

      - name: Sürüm yayınla (indirme bağlantısı)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EĞİTİM SEBLAZİZ 1.0.${{ github.run_number }}
          body: Telefon ve tablet için APK. Android 8.0 ve üzeri.
          files: out/*.apk
          make_latest: true
